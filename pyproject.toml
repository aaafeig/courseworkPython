[tool.poetry]
name = "vacanciestracker"
version = "0.1.0"
description = "приложение для работы с вакансиями: отслеживание, добавление и удаления."
authors = ["aaafeig <geroy.ozhog08@mail.ru>"]
readme = "README.md"
packages = [
    { include = "src" }
]

[tool.poetry.dependencies]
python = ">=3.12"
requests = "^2.32.3"

[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
flake8 = "^7.2.0"
pytest = "^8.3.5"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 119
exclude = ".git"

[tool.isort]
line-length = 119
